base_config:
- config/train_marigold.yaml

model:
  backbone: sdxl
  pretrained_path: stable-diffusion-xl-base-1.0
  latent_scale_factor: 0.13025 # documentation; actual value read from VAE config

pipeline:
  name: SDXLDepthPipeline

# Keep the SDXL experiment on the original VGC objective.  The base SD2
# configuration currently selects residual_snr, so override every VGC field
# here instead of depending on inherited defaults.
validity_guided_completion:
  enabled: true
  mode: legacy
  min_invalid_ratio: 0.08
  anchor_weight: 0.02
  smooth_weight: 0.005
  eps: 1.0e-6

dataloader:
  effective_batch_size: 42
  max_train_batch_size: 1
  num_workers: 4

trainer:
  use_xformers: false # PyTorch SDPA (Diffusers default attention processor)
  gradient_checkpointing: true
  mixed_precision: bf16
  report_cuda_memory: true
  check_finite_loss: true

optimizer:
  name: Adam8bit

# Full U-Net tuning. Start more conservatively than the SD2 experiment.
lr: 1.0e-5
max_iter: 23000
